name: Validate

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run validator tests
        run: node --test tools/validate-qx-rules.test.js tools/check-maintenance.test.js

      - name: Run strict rule validation
        run: node tools/validate-qx-rules.js --strict

      - name: Check legacy links and README index
        run: node tools/check-maintenance.js
